# Narration configuration (selected after objective evaluation, see workflows/tts/eval/README.md)
primary:
  engine: Qwen3-TTS
  repo: https://github.com/QwenLM/Qwen3-TTS
  package: qwen-tts==0.1.1 (PyPI)
  design_model: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign   # Apache-2.0
  clone_model: Qwen/Qwen3-TTS-12Hz-1.7B-Base           # Apache-2.0
  tokenizer: Qwen/Qwen3-TTS-Tokenizer-12Hz
  device: cpu
  dtype: bfloat16
  threads: 4
  persona_instruct: >-
    Male narrator, about 55 years old, deep baritone voice with a warm, smooth, rounded tone. Calm, soothing and
    measured, like a premium historical documentary. Natural pacing with gentle pauses, clear articulation, serious
    and reflective, quietly investigative, never theatrical or exaggerated.
  reference_audio: assets/narration/reference/narrator_reference.wav   # designed once (seed 7), reused for every chapter
  reference_text: assets/narration/reference/ref_text.txt
  synthesis_unit: sentence            # one generate call per sentence, leading/trailing silence trimmed
  sentence_pause_s: 0.45              # x1.25 after questions
  seed_base: 20261119
  pronunciation_lexicon: configuration/pronunciation_lexicon.yaml
  sample_rate: 24000
backup:
  engine: Kokoro-82M
  repo: https://github.com/hexgrad/kokoro
  weights: hexgrad/Kokoro-82M (Apache-2.0)
  voice: bm_lewis
  lang_code: b
  speed: 0.92
  script: scripts/narration/kokoro_tts.py
post_processing:
  highpass_hz: 70
  de_ess: gentle (ffmpeg deesser)
  loudness_target_lufs: -16       # narration stem; final mix normalised to -16 LUFS integrated, -1.5 dBTP
