# Visual asset register. Every generated asset keeps its prompt and settings next to the output (assets/images/<id>.json).
# label: overlay tag shown on screen (evidence grammar). kinds: ai | blender | map | photo | nasa | graphic
style:
  photo: "cinematic documentary photograph, shot on 35mm film, natural light, realistic textures, muted earth tones, subtle atmospheric haze, high detail, wide dynamic range"
  recon: "photorealistic historical reconstruction, documentary realism, natural light, weathered materials, plausible ancient South Arabian architecture, muted earth palette, atmospheric haze"
  legend: "ink and wash illustration on aged parchment with gold leaf highlights, antique storybook engraving style, sepia and gold tones, fine linework, flat perspective, no text"
negative:
  default: "text, letters, words, writing, watermark, logo, signature, caption, frame, border, modern buildings, cars, roads, power lines, airplane, close-up face, portrait, cartoon, anime, 3d render, cgi, plastic, oversaturated, neon, fantasy glow, sci-fi, blurry, lowres, jpeg artifacts, deformed, extra limbs"
  legend: "photograph, photorealistic, text, letters, calligraphy, watermark, logo, signature, modern, 3d render, blurry, deformed, close-up face"
