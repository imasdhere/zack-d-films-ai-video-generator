# SDXL img2img passes over Blender layouts: the 3D scene fixes geometry and camera; SDXL adds photographic materials and light.
img2img:
  B02_V1: {src: assets/3d_models/renders/columns_v1.png, denoise: 0.58, style: recon, label: "ARTISTIC RECONSTRUCTION — ONE IMAGINED READING", prompt: "an imagined ancient South Arabian sanctuary with a row of tall square monolithic limestone pillars on a high ashlar stone platform with a broad stair, multi-storey mud-brick tower houses behind, desert valley, soft morning light, dust haze, weathered stone texture"}
  B02_V2: {src: assets/3d_models/renders/columns_v2.png, denoise: 0.55, style: recon, label: "ARTISTIC RECONSTRUCTION — ONE IMAGINED READING", prompt: "low angle view along a row of towering square monolithic limestone pillars with notched tops on an ashlar platform, ancient South Arabia, bright hazy sky, weathered pale stone, sand"}
  B02_V3: {src: assets/3d_models/renders/columns_v3.png, denoise: 0.6, style: recon, label: "ARTISTIC RECONSTRUCTION — ONE IMAGINED READING", prompt: "distant view of an imagined ancient walled settlement of mud-brick tower houses and a pillared stone sanctuary in a wide sandy desert valley, dunes on the horizon, warm haze, documentary landscape"}
