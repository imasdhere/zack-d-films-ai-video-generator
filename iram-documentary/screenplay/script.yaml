# Single source of truth for narration, on-screen text and claim traceability.
# Each segment = one narration paragraph (synthesised as one TTS job, sentence by sentence).
# claims: IDs in research/claim_verification_matrix.csv
# evidence: Q=Quran, H=hadith, C=classical scholarship, L=later tradition/legend, A=archaeology,
#           S=science/geography hypothesis, R=artistic reconstruction, N=narrative framing (no factual claim)
title: "THE LOST CITY OF IRAM"
subtitle: "In Search of the People of the Pillars"
chapters:
  - id: 0
    title: "Cold Open"
    segments:
      - id: "0.01"
        pre_silence: 7.0
        evidence: N
        claims: []
        text: >-
          There are places on Earth where the land itself seems to forget. Here, in the south of Arabia,
          the wind has been moving sand for thousands of years. Lifting it. Folding it. Laying it down again.
          Footprints vanish by evening. Whole dunes walk.
      - id: "0.02"
        pre_silence: 2.5
        evidence: N
        claims: []
        text: >-
          And yet, some names survive the wind. One of them is Iram.
        post_silence: 3.0
  - id: 1
    title: "The Disappearance"
    segments:
      - id: "1.01"
        evidence: S
        claims: [G01, G02]
        text: >-
          The Rubʿ al-Khālī, the Empty Quarter, covers some six hundred and fifty thousand square kilometres
          of the Arabian Peninsula, across parts of Saudi Arabia, Oman, the United Arab Emirates and Yemen.
          It is often described as the largest continuous sand desert on Earth. In places, its dunes rise
          more than two hundred metres.
      - id: "1.02"
        evidence: L
        claims: [L01]
        text: >-
          For centuries, those who lived along its edges told stories of a people of great strength,
          of towering buildings, and of a city that was lost.
      - id: "1.03"
        evidence: Q
        claims: [Q01]
        onscreen: "Q89_6_8"
        text: >-
          The oldest written source for that memory is the Quran. In a short passage of Sūrat al-Fajr,
          the chapter of the Dawn, it asks:
      - id: "1.04"
        evidence: Q
        claims: [Q01]
        onscreen: "Q89_6_8"
        quote: true
        text: >-
          "Dost thou not consider how thy Lord dealt with the tribe of ʿĀd, with many-columned Iram,
          the like of which was not created in the lands."
      - id: "1.05"
        evidence: Q
        claims: [Q02, Q03]
        text: >-
          Three short verses. A people: ʿĀd. A name: Iram. And a description: dhāt al-ʿimād.
          Possessing ʿimād. A word that can mean columns, or pillars, or the poles that hold up a tent.
      - id: "1.06"
        evidence: L
        claims: [L01, L02]
        text: >-
          From these few words grew one of the most enduring mysteries of the Arabian desert.
          Storytellers imagined palaces of gold. Popular retellings still speak of a city of a thousand pillars.
          Explorers went looking for it. And satellites photographed the sand where it might lie.
      - id: "1.07"
        evidence: N
        claims: []
        text: >-
          This film asks three questions. What does the text actually say? What did the earliest scholars
          understand by it? And what, if anything, has archaeology really found?
      - id: "1.08"
        evidence: N
        claims: []
        onscreen: "EVIDENCE_KEY"
        text: >-
          To answer them, we must keep different kinds of evidence apart: scripture, scholarship, legend,
          excavation and hypothesis. Throughout this film, each will be marked as it appears.
        post_silence: 2.0
  - id: 2
    title: "The People of ʿĀd"
    segments:
      - id: "2.01"
        evidence: Q
        claims: [Q04]
        text: >-
          The Quran names ʿĀd twenty-four times. Iram, it names only once.
      - id: "2.02"
        evidence: Q
        claims: [Q05, Q06]
        text: >-
          In the Quranic account, ʿĀd were a people who came after the people of Noah.
          To them was sent a prophet from among themselves. The Quran calls him their brother: Hūd.
      - id: "2.03"
        evidence: Q
        claims: [Q07, Q08]
        text: >-
          It describes a people blessed with plenty. Hūd reminds them that God has aided them
          "with cattle and sons, and gardens and watersprings." He reminds them that they were given
          "growth of stature": in Arabic, basṭa, a word the commentators read as size, or strength, or reach.
      - id: "2.04"
        evidence: Q
        claims: [Q09]
        text: >-
          They were builders. "Build ye on every high place a monument for vain delight?" Hūd asks them.
          "And seek ye out strongholds, that haply ye may last for ever?"
      - id: "2.05"
        evidence: Q
        claims: [Q10]
        text: >-
          And they were certain of their own power. "Who is mightier than us in power?" they ask.
      - id: "2.06"
        evidence: Q
        claims: [Q11]
        text: >-
          The Quran tells us where Hūd preached in a single phrase. He warned his people, it says,
          "among the wind-curved sandhills": bil-Aḥqāf.
      - id: "2.07"
        evidence: C
        claims: [C01]
        text: >-
          Classical scholars tried to find that landscape on the map. The great exegete al-Ṭabarī,
          who died in Baghdad in the year nine hundred and twenty-three, explained that aḥqāf means sand
          that curves and bends. He placed the land of ʿĀd in the south: in al-Shiḥr, in the region of
          Ḥaḍramawt, and the lands around it.
      - id: "2.08"
        evidence: L
        claims: [L03]
        text: >-
          In Ḥaḍramawt today, a tomb attributed to the Prophet Hūd is still visited by pilgrims.
          It is a living tradition, though more than one place has claimed his resting place.
      - id: "2.09"
        evidence: Q
        claims: [Q12]
        text: >-
          What the Quran does not give us is a date, a map, or a description of a city.
          It gives a moral history: a people given strength and plenty; a warning; a refusal.
      - id: "2.10"
        evidence: N
        claims: [E01]
        text: >-
          In this film, the Prophet Hūd is never shown. And the people of ʿĀd appear only as distant figures,
          because no one knows what they looked like.
        post_silence: 2.0
  - id: 3
    title: "Iram of the Pillars"
    segments:
      - id: "3.01"
        evidence: Q
        claims: [Q13]
        text: >-
          Iram dhāt al-ʿimād. Translators still disagree on how to render it. Marmaduke Pickthall, in nineteen
          thirty, wrote "many-columned Iram". A modern translation, Saheeh International, has "Iram, who had
          lofty pillars". Even the next verse divides them. Was Iram a place, "the like of which" was never
          created? Or a people, "the likes of whom"?
      - id: "3.02"
        evidence: C
        claims: [C02]
        text: >-
          Muslim scholars were asking the same questions more than a thousand years ago.
      - id: "3.03"
        evidence: C
        claims: [C03]
        text: >-
          Al-Ṭabarī gathered the opinions of the generations before him. Some said Iram was a city:
          Alexandria, according to one early authority; Damascus, according to another. Some said it was
          a nation. Others said it was a clan of ʿĀd, "the royal house of ʿĀd", in the words of the early
          scholar Qatāda, or the name of their ancestor.
      - id: "3.04"
        evidence: C
        claims: [C04]
        text: >-
          Al-Ṭabarī weighed these views, and concluded that Iram was most likely the name of a tribe of ʿĀd.
          Then he turned to the pillars.
      - id: "3.05"
        evidence: C
        claims: [C05]
        text: >-
          Some early authorities said the word described the people themselves: their great height.
          One said it meant a building they had raised, on tall columns. But the view al-Ṭabarī preferred
          was simpler. The ʿimād, he argued, were the poles of tents. ʿĀd were "people of poles":
          travellers, moving with the rains and the pasture.
      - id: "3.06"
        evidence: C
        claims: [C06]
        onscreen: "TABARI_QUOTE"
        text: >-
          And he added a sentence that cuts to the heart of this mystery. No building of theirs with columns,
          he wrote, is known through any authentic report.
        arabic_quotes:   # read by the Arabic narrator; text verbatim from the on-screen card (graphics.g_tabari_quote)
          - text: "ولا يعلم بناء كان لهم بالعماد بخبر صحيح"
            tts: "وَلَا يُعْلَمُ بِنَاءٌ كَانَ لَهُمْ بِالْعِمَادِ بِخَبَرٍ صَحِيحْ"
            after_sentence: 0
            kind: classical
            source: "al-Ṭabarī, Jāmiʿ al-Bayān, on Q 89:7"
        post_silence: 1.5
      - id: "3.07"
        evidence: C
        claims: [C07]
        text: >-
          Four centuries later, in Damascus, the scholar Ibn Kathīr agreed. Whether the ʿimād were buildings,
          or tent poles, or weapons, or the height of the people, he wrote, ʿĀd were a tribe:
          "a nation among the nations".
        arabic_quotes:   # graphics.g_ibnkathir_quote
          - text: "فهم قبيلة وأمة من الأمم"
            tts: "فَهُمْ قَبِيلَةٌ وَأُمَّةٌ مِنَ الْأُمَمْ"
            after_sentence: 0
            kind: classical
            source: "Ibn Kathīr, Tafsīr al-Qurʾān al-ʿAẓīm, on Q 89:8"
      - id: "3.08"
        evidence: L
        claims: [L04]
        text: >-
          So where did the golden city come from? By Ibn Kathīr's time, a rich legend had grown around the verse.
          In some versions, a king named Shaddād, son of ʿĀd, built it. Commentators described a city of bricks
          of gold and silver, its pebbles pearls and jewels, its soil made of musk. A city that moved from land
          to land: sometimes in Syria, sometimes in Yemen, sometimes in Iraq.
      - id: "3.09"
        evidence: L
        claims: [L05]
        text: >-
          One story told of a Bedouin, ʿAbd Allāh ibn Qilāba, who, while searching for his lost camels in the
          time of the caliph Muʿāwiya, came upon a great city with walls and gates. When others went back with
          him to the place, they found nothing.
      - id: "3.10"
        evidence: C
        claims: [C08]
        text: >-
          Ibn Kathīr rejected all of it. These were, in his words, fables of the Israʾīliyyāt. The tale of
          Ibn Qilāba, he said, had no sound chain of transmission, and was certainly not authentic.
        arabic_quotes:   # graphics.g_ibnkathir_reject (two excerpts, read as two sentences)
          - text: "فإن هذا كله من خرافات الإسرائيليين. فهذه الحكاية ليس يصح إسنادها."
            tts: "فَإِنَّ هَذَا كُلَّهُ مِنْ خُرَافَاتِ الْإِسْرَائِيلِيِّينْ. فَهَذِهِ الْحِكَايَةُ لَيْسَ يَصِحُّ إِسْنَادُهَا."
            after_sentence: 0
            kind: classical
            source: "Ibn Kathīr, Tafsīr al-Qurʾān al-ʿAẓīm, on Q 89:8"
      - id: "3.11"
        evidence: L
        claims: [L06]
        text: >-
          The legend lived on regardless. It entered the Thousand and One Nights, and later the poetry and
          fiction of Europe.
      - id: "3.12"
        evidence: R
        claims: [R01]
        onscreen: "RECON_LABEL"
        text: >-
          What you are seeing now is an artistic reconstruction. One imagined reading of the verse: a settlement
          raised on stone columns. It is not based on any excavated site. The Quran does not describe Iram's
          appearance, and no archaeologist has found it.
      - id: "3.13"
        evidence: R
        claims: [R02, C05]
        onscreen: "RECON_LABEL_TENTS"
        text: >-
          And this is the other reading, the one the classical scholars preferred: great tents of woven hair,
          raised on poles, moving across the land. It too is an interpretation. But it reminds us how much a
          single word can carry.
      - id: "3.14"
        evidence: N
        claims: []
        text: >-
          The city of a thousand pillars is real, in its way. But it belongs to the history of storytelling.
          The text itself is far more restrained.
        post_silence: 2.5
  - id: 4
    title: "The Search Beneath the Sands"
    segments:
      - id: "4.01"
        evidence: N
        claims: []
        text: >-
          In the twentieth century, the search moved from the library into the desert.
      - id: "4.02"
        evidence: A
        claims: [A01, A02]
        text: >-
          In nineteen thirty, the British explorer Bertram Thomas set out to cross the Empty Quarter, guided by
          Bedouin of the Rashīd tribe. He became the first Westerner on record to do so. Along the way, his guides
          pointed to wide tracks between the dunes. "Look, Sahib," one said. "There is the way to Ubar."
      - id: "4.03"
        evidence: A
        claims: [A03]
        text: >-
          Thomas wrote of "this Atlantis of the Sands". The phrase is often credited to Lawrence of Arabia,
          but it does not appear in Lawrence's published works.
      - id: "4.04"
        evidence: L
        claims: [L07]
        text: >-
          Ubar, or Wabār, was a name from Arabian tradition: a fabled place of wealth and ruin somewhere in the
          sands. Over time, some writers began to merge it with the Quranic Iram.
      - id: "4.05"
        evidence: A
        claims: [A04]
        text: >-
          In nineteen thirty-two, Harry St John Philby went in search of Wabār, deep in the Rubʿ al-Khālī.
          Bedouin had told him of ruins, and of a block of iron the size of a camel. After a month of hard travel,
          he reached a field of black glass and craters half choked with sand. He thought it was a volcano.
      - id: "4.06"
        evidence: A
        claims: [A05]
        text: >-
          It was neither a city nor a volcano. Samples sent to the British Museum showed that it was the impact
          site of an iron meteorite. Later luminescence dating suggests the craters may be only a few centuries
          old, perhaps less than two hundred and fifty years. A real place, and a real mystery. But not Iram.
        post_silence: 1.5
      - id: "4.07"
        evidence: A
        claims: [A06]
        text: >-
          To understand why anyone would travel through this desert at all, follow the smoke of frankincense.
          Frankincense is the resin of Boswellia sacra, a tree that still grows in the dry valleys of Dhofar,
          in southern Oman. In the ancient world, it was prized from Arabia to Rome.
      - id: "4.08"
        evidence: A
        claims: [A07]
        text: >-
          A Greek sailing guide of the first century, the Periplus of the Erythraean Sea, describes this coast as
          "the Frankincense Country, mountainous and forbidding, wrapped in thick clouds and fog." It names a
          harbour called Moscha, where ships took on the resin, under the control of the king's officers.
      - id: "4.09"
        evidence: A
        claims: [A08]
        text: >-
          Moscha is identified with Khor Rori, near modern Salalah, where the walls of a fortified port called
          Sumhuram still stand. From this coast and its hinterland, frankincense moved inland and north,
          along caravan routes that linked southern Arabia to the Mediterranean world.
      - id: "4.10"
        evidence: A
        claims: [A09]
        text: >-
          Decades after Thomas, an American filmmaker, Nicholas Clapp, read his account and set out to find Ubar.
          He brought together scientists from NASA's Jet Propulsion Laboratory, among them Ronald Blom and
          Charles Elachi, with the archaeologist Juris Zarins, the explorer Ranulph Fiennes, and George Hedges.
      - id: "4.11"
        evidence: A
        claims: [A10]
        onscreen: "NASA_CREDIT"
        text: >-
          Satellites could not see a buried city. But Landsat images revealed something subtler: faint,
          ancient tracks crossing the desert floor. And several of them led towards one place.
          In nineteen ninety-four, radar aboard the Space Shuttle Endeavour imaged the same region,
          and the tracks appeared again, as soft red streaks.
      - id: "4.12"
        evidence: A
        claims: [A11]
        text: >-
          That place was Shisr, a small oasis in Dhofar, about one hundred and seventy kilometres inland, with a
          Bedouin well and a ruined fort that earlier travellers had dismissed as only a few centuries old.
      - id: "4.13"
        evidence: A
        claims: [A12, A13]
        text: >-
          Excavation began under Juris Zarins. Beneath the later fort, the team uncovered the walls and towers
          of a much older fortress, more than two thousand years old in its earliest phases, according to its
          excavators. They found objects from Persia, Greece and Rome: the traces of long-distance trade.
          And they found that much of the fortress had collapsed into a sinkhole, the limestone cavern that
          held the well.
      - id: "4.14"
        evidence: A
        claims: [A14]
        text: >-
          In February nineteen ninety-two, newspapers around the world announced that the lost city of Ubar
          had been found.
        post_silence: 1.5
      - id: "4.15"
        evidence: A
        claims: [A15]
        text: >-
          But the scientists themselves soon told a more careful story. Juris Zarins argued that, in the
          classical and Arabic sources, Ubar was not a single town at all, but a region and a people: the
          Iobaritae, marked on the second-century map of Ptolemy. Shisr, in this view, was one fortified station
          in that land, a vital source of water on the frankincense routes.
      - id: "4.16"
        evidence: A
        claims: [A16]
        text: >-
          Others went further. In two thousand and four, the geologist H. Stewart Edgell published a critique
          titled "The myth of the lost city of the Arabian Sands", arguing that Shisr had been a small
          caravanserai, not a lost metropolis.
      - id: "4.17"
        evidence: A
        claims: [A17]
        text: >-
          Today, Shisr is part of a UNESCO World Heritage property, the Land of Frankincense. UNESCO describes it
          not as Iram, but as "the remains of the caravan oasis of Shisr, or Wubar": a station for water on the
          routes of the incense trade.
      - id: "4.18"
        evidence: A
        claims: [A18]
        text: >-
          So what did Shisr prove? It proved that ancient tracks can be traced from space. It proved that this
          desert edge was busy with trade. It did not prove that Shisr was Ubar. And it did not prove that Ubar
          was Iram.
      - id: "4.19"
        evidence: N
        claims: []
        onscreen: "THREE_TIERS"
        text: >-
          The difference matters. A popular identification is a story that people choose to tell.
          An archaeological interpretation is an argument from evidence. An established conclusion is what
          remains when the arguments have been tested. The link between Shisr and Iram has never moved beyond
          the first.
        post_silence: 2.5
  - id: 5
    title: "What Happened?"
    segments:
      - id: "5.01"
        evidence: Q
        claims: [Q14]
        text: >-
          The Quran's account of how ʿĀd came to an end is brief, and vivid. They demanded the punishment they
          had been warned of. And then, the text says,
      - id: "5.02"
        evidence: Q
        claims: [Q14]
        quote: true
        onscreen: "Q46_24_25"
        text: >-
          "when they beheld it as a dense cloud coming toward their valleys, they said: Here is a cloud bringing
          us rain. Nay, but it is that which ye did seek to hasten, a wind wherein is painful torment,
          destroying all things by commandment of its Lord. And morning found them so that naught could be seen
          save their dwellings."
        post_silence: 1.5
      - id: "5.03"
        evidence: Q
        claims: [Q15, Q16]
        text: >-
          Elsewhere the wind is called ṣarṣar, raging, or roaring, and al-ʿaqīm, the barren wind.
          It blew, the Quran says, "for seven long nights and eight long days". Hūd, and those who believed with
          him, were saved.
      - id: "5.04"
        evidence: H
        claims: [H01]
        onscreen: "HADITH_AISHA"
        text: >-
          The memory of that wind stayed with the Prophet Muhammad. His wife ʿĀʾisha reported that whenever he
          saw clouds or wind, concern showed on his face. When she asked him why, he said that a people had been
          punished with wind, and that when they saw it coming, they had said, "This cloud will give us rain."
        arabic_quotes:   # graphics.g_hadith_aisha; contains the Quranic words of 46:24, so the router sends it to the
                         # Quranic review workflow and keeps it out of the mix until a qualified reviewer approves it
          - text: "عُذِّبَ قَوْمٌ بِالرِّيحِ، وَقَدْ رَأَى قَوْمٌ الْعَذَابَ فَقَالُوا هَذَا عَارِضٌ مُمْطِرُنَا"
            after_sentence: end
            kind: hadith
            source: "Ṣaḥīḥ al-Bukhārī 4828–4829; Ṣaḥīḥ Muslim 899"
      - id: "5.05"
        evidence: H
        claims: [H02]
        onscreen: "HADITH_SABA"
        text: >-
          In another authentic report, he said: "I was granted victory with the east wind, and ʿĀd were
          destroyed by the west wind."
        arabic_quotes:   # graphics.g_hadith_saba
          - text: "نُصِرْتُ بِالصَّبَا، وَأُهْلِكَتْ عَادٌ بِالدَّبُورِ"
            tts: "نُصِرْتُ بِالصَّبَا، وَأُهْلِكَتْ عَادٌ بِالدَّبُورْ"
            after_sentence: -1
            kind: hadith
            source: "Ṣaḥīḥ al-Bukhārī 1035; Ṣaḥīḥ Muslim 900"
        post_silence: 2.5
      - id: "5.06"
        evidence: S
        claims: [N01]
        onscreen: "SCIENCE_DIVIDER"
        text: >-
          Science cannot test a religious account of divine judgement. But it can ask a different question:
          how has this land itself changed?
      - id: "5.07"
        evidence: S
        claims: [S01]
        text: >-
          In a cave called Qunf, in the mountains of Dhofar, a stalagmite has recorded rainfall for thousands of
          years, layer by layer. A study published in two thousand and three found that monsoon rain here was
          stronger in the early Holocene, and that after about eight thousand years ago, it gradually declined.
      - id: "5.08"
        evidence: S
        claims: [S02]
        text: >-
          Deep in the Rubʿ al-Khālī, researchers reported in two thousand and twenty-five that, during an ancient
          humid phase, heavy rains filled a lake of about eleven hundred square kilometres, which eventually broke
          its banks and carved a valley some one hundred and fifty kilometres long.
      - id: "5.09"
        evidence: S
        claims: [S03]
        text: >-
          Arabia, in other words, was not always this dry. Over many thousands of years, its landscapes have
          shifted between green and gold.
      - id: "5.10"
        evidence: N
        claims: [S04, A19]
        text: >-
          But we should be clear. These changes unfolded over centuries and millennia. No study has dated the
          people of ʿĀd, and no geological event has been shown to match the Quranic account. At Shisr, the
          excavators found no evidence that a sandstorm destroyed the site. The collapse of its fortress into a
          sinkhole has a geological explanation, and no known connection to ʿĀd.
      - id: "5.11"
        evidence: N
        claims: []
        text: >-
          Religious memory and physical evidence are answering different questions. Merging them would do
          justice to neither.
        post_silence: 2.5
  - id: 6
    title: "The Mystery Remains"
    segments:
      - id: "6.01"
        evidence: A
        claims: []
        text: >-
          In recent years, the search for Iram has taken an unexpected turn, away from the southern sands altogether.
      - id: "6.02"
        evidence: A
        claims: [A20, A21]
        text: >-
          In the deserts of southern Jordan lies Wadi Ramm, the valley known today as Wadi Rum: red cliffs, and
          some twenty thousand recorded inscriptions. A Nabataean temple to the goddess Allat stands at the foot of
          Jabal Ramm, and inscriptions from the site give the ancient name of the place as Iram.
      - id: "6.03"
        evidence: S
        claims: [A22]
        text: >-
          In two thousand and twenty-five, the epigrapher Ahmad Al-Jallad published a study of pre-Islamic
          inscriptions written by members of a tribe called ʿĀd, in the deserts of the north, and argued that
          the Quranic names may belong to this region.
      - id: "6.04"
        evidence: S
        claims: [A22]
        text: >-
          It is a serious proposal, built on careful readings of ancient texts. It is also new, and scholars are
          still weighing it. Like Shisr before it, it shows how much depends on the evidence we choose to follow.
        post_silence: 2.0
      - id: "6.05"
        evidence: N
        claims: []
        onscreen: "SUMMARY_TIERS"
        text: >-
          So, what can we actually say?
      - id: "6.06"
        evidence: Q
        claims: [Q05, Q09, Q14, Q01]
        text: >-
          The Quran tells of a people named ʿĀd; of their prophet, Hūd; of their strength and their building;
          and of a wind that left only their dwellings. It names Iram once, and calls it dhāt al-ʿimād.
      - id: "6.07"
        evidence: C
        claims: [C04, C05, C07, C08]
        text: >-
          The classical scholars recorded a debate. Two of the most influential, al-Ṭabarī and Ibn Kathīr,
          understood Iram as a tribe, and its ʿimād as the poles of tents. And they rejected the legend of a
          golden city.
      - id: "6.08"
        evidence: A
        claims: [A17, A20, A22]
        text: >-
          Archaeology has found real places: a caravan fortress at Shisr, frankincense ports on the coast, and,
          in the north, inscriptions that name both Iram and a tribe called ʿĀd. It has not found a city of a
          thousand pillars.
      - id: "6.09"
        evidence: N
        claims: []
        text: >-
          And some things remain unknown: when ʿĀd lived; exactly where; and what their pillars really were.
        post_silence: 2.5
      - id: "6.10"
        evidence: N
        claims: []
        text: >-
          Perhaps that is the real lesson of Iram. A people can survive in memory long after their stones are
          gone, or even if they never built in stone at all. A few words in a sacred text have outlived empires,
          maps and explorers.
      - id: "6.11"
        evidence: N
        claims: []
        text: >-
          The wind still moves across the sand, as it always has, erasing footprints by evening.
          What remains is the question. And the discipline to tell the difference between what we know,
          what we believe, and what we only imagine.
        post_silence: 8.0
